services:
  - type: web
    name: between-sundays
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_FROM_NAME
        value: Between Sundays
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CLIENT_PORTAL_URL
        sync: false
      - key: DEMO_URL
        value: https://demo.betweensundaysconsulting.com
      - key: SEND_CONFIRMATION
        value: true
